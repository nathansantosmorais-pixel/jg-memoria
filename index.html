<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Memória - Carros Realistas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0c1222, #1a2332);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: #f1f5f9;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 18px;
      font-size: 0.95rem;
    }

    .stats {
      display: flex;
      gap: 28px;
      margin-bottom: 22px;
      font-size: 1.15rem;
      background: rgba(255,255,255,0.04);
      padding: 12px 32px;
      border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
    }

    .stats span {
      color: #38bdf8;
      font-weight: 700;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 11px;
      max-width: 680px;
      width: 100%;
      perspective: 1200px;
    }

    .card {
      aspect-ratio: 1;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card:hover:not(.flipped):not(.matched) {
      transform: scale(1.04);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card.matched {
      pointer-events: none;
    }

    .card.matched .front {
      box-shadow: 0 0 0 3px #22c55e, 0 8px 25px rgba(34, 197, 94, 0.25);
    }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
    }

    .back {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 2px solid #334155;
      box-shadow: 
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 6px 20px rgba(0,0,0,0.45);
    }

    .back::before {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 10px;
      background: linear-gradient(145deg, #334155, #1e293b);
      border: 1px solid #475569;
    }

    .back::after {
      content: "🚗";
      position: relative;
      z-index: 1;
      font-size: 1.7rem;
      opacity: 0.35;
    }

    .front {
      background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
      border: 2px solid #38bdf8;
      transform: rotateY(180deg);
      box-shadow: 
        0 8px 25px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.1);
      gap: 6px;
      padding: 8px;
    }

    .front .car-icon {
      width: 58%;
      height: 58%;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }

    .front .car-icon svg {
      width: 100%;
      height: 100%;
    }

    .front .name {
      font-size: 0.68rem;
      font-weight: 700;
      color: #e2e8f0;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }

    .controls {
      margin-top: 26px;
    }

    button {
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      color: #0f172a;
      border: none;
      padding: 13px 32px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.45);
    }

    .win-message {
      position: fixed;
      inset: 0;
      background: rgba(8, 12, 22, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    .win-message.show {
      opacity: 1;
      pointer-events: all;
    }

    .win-message h2 {
      font-size: 2.6rem;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #22c55e, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .win-message p {
      color: #94a3b8;
      margin-bottom: 28px;
      font-size: 1.25rem;
    }

    @media (max-width: 700px) {
      .board {
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }
      .front .name {
        font-size: 0.58rem;
      }
    }

    @media (max-width: 480px) {
      .board {
        grid-template-columns: repeat(4, 1fr);
      }
      h1 { font-size: 1.55rem; }
    }
  </style>
</head>
<body>
  <h1>🏎️ Jogo da Memória</h1>
  <p class="subtitle">Encontre os 15 pares de veículos realistas!</p>
