<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Memória - Carros</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: #f1f5f9;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    .stats {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      font-size: 1.1rem;
      background: rgba(255,255,255,0.05);
      padding: 12px 28px;
      border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .stats span {
      color: #38bdf8;
      font-weight: 700;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      max-width: 520px;
      width: 100%;
      perspective: 1000px;
    }

    .card {
      aspect-ratio: 1;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card.matched {
      pointer-events: none;
    }

    .card.matched .front {
      box-shadow: 0 0 0 3px #22c55e;
    }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      user-select: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .back {
      background: linear-gradient(145deg, #1e293b, #334155);
      border: 2px solid #475569;
    }

    .back::after {
      content: "🚗";
      font-size: 1.8rem;
      opacity: 0.4;
    }

    .front {
      background: linear-gradient(145deg, #0f172a, #1e293b);
      border: 2px solid #38bdf8;
      transform: rotateY(180deg);
      gap: 6px;
    }

    .front .name {
      font-size: 0.75rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .controls {
      margin-top: 28px;
      display: flex;
      gap: 12px;
    }

    button {
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      color: #0f172a;
      border: none;
      padding: 12px 28px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
    }

    .win-message {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    .win-message.show {
      opacity: 1;
      pointer-events: all;
    }

    .win-message h2 {
      font-size: 2.5rem;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #22c55e, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .win-message p {
      color: #94a3b8;
      margin-bottom: 24px;
      font-size: 1.2rem;
    }

    @media (max-width: 500px) {
      .board {
        gap: 8px;
      }
      .face {
        font-size: 1.8rem;
      }
      .front .name {
        font-size: 0.65rem;
      }
      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <h1>🏎️ Jogo da Memória</h1>
  <p class="subtitle">Encontre os pares de carros!</p>

  <div class="stats">
    <div>Tempo: <span id="timer">00:00</span></div>
    <div>Pares: <span id="pairs">0</span>/8</div>
  </div>

  <div class="board" id="board"></div>

  <div class="controls">
    <button onclick="restartGame()">Reiniciar</button>
  </div>

  <div class="win-message" id="winMessage">
    <h2>Parabéns! 🎉</h2>
    <p>Você encontrou todos os pares em <span id="finalTime">00:00</span>!</p>
    <button onclick="restartGame()">Jogar Novamente</button>
  </div>

  <script>
    const cars = [
      { emoji: "🚗", name: "Sedan" },
      { emoji: "🚙", name: "SUV" },
      { emoji: "🏎️", name: "Esportivo" },
      { emoji: "🛻", name: "Pickup" },
      { emoji: "🚕", name: "Táxi" },
      { emoji: "🚐", name: "Van" },
      { emoji: "🚔", name: "Polícia" },
      { emoji: "🚑", name: "Ambulância" }
    ];

    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let lockBoard = false;
    let timerInterval = null;
    let seconds = 0;
    let timerStarted = false;

    function formatTime(totalSeconds) {
      const min = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
      const sec = (totalSeconds % 60).toString().padStart(2, "0");
      return `${min}:${sec}`;
    }

    function startTimer() {
      if (timerStarted) return;
      timerStarted = true;
      timerInterval = setInterval(() => {
        seconds++;
        document.getElementById("timer").textContent = formatTime(seconds);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function createBoard() {
      const board = document.getElementById("board");
      board.innerHTML = "";

      cards = shuffle([...cars, ...cars]);

      cards.forEach((car, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.index = index;

        card.innerHTML = `
          <div class="face back"></div>
          <div class="face front">
            <span>${car.emoji}</span>
            <span class="name">${car.name}</span>
          </div>
        `;

        card.addEventListener("click", () => flipCard(card, index));
        board.appendChild(card);
      });
    }

    function flipCard(card, index) {
      if (lockBoard || card.classList.contains("flipped") || card.classList.contains("matched")) {
        return;
      }

      // Começa o cronômetro no primeiro clique
      startTimer();

      card.classList.add("flipped");
      flippedCards.push({ card, index, car: cards[index] });

      if (flippedCards.length === 2) {
        lockBoard = true;

        const [first, second] = flippedCards;

        if (first.car.name === second.car.name) {
          // Match!
          setTimeout(() => {
            first.card.classList.add("matched");
            second.card.classList.add("matched");
            matchedPairs++;
            document.getElementById("pairs").textContent = matchedPairs;
            flippedCards = [];
            lockBoard = false;

            if (matchedPairs === 8) {
              stopTimer();
              document.getElementById("finalTime").textContent = formatTime(seconds);
              document.getElementById("winMessage").classList.add("show");
            }
          }, 400);
        } else {
          // Não bateu
          setTimeout(() => {
            first.card.classList.remove("flipped");
            second.card.classList.remove("flipped");
            flippedCards = [];
            lockBoard = false;
          }, 900);
        }
      }
    }

    function restartGame() {
      stopTimer();
      matchedPairs = 0;
      seconds = 0;
      timerStarted = false;
      flippedCards = [];
      lockBoard = false;
      document.getElementById("timer").textContent = "00:00";
      document.getElementById("pairs").textContent = "0";
      document.getElementById("winMessage").classList.remove("show");
      createBoard();
    }

    // Inicia o jogo
    createBoard();
  </script>
</body>
</html>
